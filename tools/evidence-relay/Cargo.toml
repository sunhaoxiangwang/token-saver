[package]
name = "evidence-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Development-only stdio relay that records allowlisted MCP evidence fields"
publish = false

[[bin]]
name = "evidence-relay"
path = "src/main.rs"

[dependencies]
serde_json = "1"
sha2 = "0.11"
libc = "0.2"

[dev-dependencies]
libc = "0.2"
